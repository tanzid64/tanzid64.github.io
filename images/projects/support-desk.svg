    <circle cx="116" cy="451" r="17" fill="#f7eedc" stroke="#13283a" stroke-width="1"/><text x="116" y="456" text-anchor="middle" fill="#13283a" font-weight="700" font-size="13">FB</text>
    <text x="142" y="445" font-weight="600">Messenger lead</text><text x="142" y="465" fill="#5a6c7e" font-size="12.5">Is COD available?</text>
