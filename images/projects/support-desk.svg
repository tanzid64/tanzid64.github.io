<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Illustration of the private WhatsApp support desk (not a screenshot) -->
  <rect width="1200" height="625" fill="#e2eff7"/>
  <g fill="none" stroke="#13283a" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M1110 60c2 14 12 24 26 26-14 2-24 12-26 26-2-14-12-24-26-26 14-2 24-12 26-26z"/>
    <path d="M40 590c40-10 80-10 130-2M60 608c30-6 60-7 90-3"/>
  </g>

  <!-- desktop app window -->
