    <rect x="345" y="492" width="505" height="48" rx="12" fill="#fff" stroke="#13283a" stroke-width="1.5"/>
    <text x="365" y="521" fill="#8b9cad">Type a reply or /shortcut…</text>
    <circle cx="824" cy="516" r="16" fill="#13283a"/><path d="M817 516h13m-5-6 6 6-6 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- phone (Flutter app) -->
  <rect x="880" y="120" width="250" height="440" rx="34" fill="#13283a"/>
  <rect x="892" y="134" width="226" height="412" rx="24" fill="#ffffff"/>
  <rect x="975" y="142" width="60" height="8" rx="4" fill="#13283a"/>
  <g font-size="12.5">
    <text x="910" y="182" font-size="15" font-weight="700" fill="#13283a">Transfers</text>
    <rect x="910" y="194" width="58" height="22" rx="11" fill="#13283a"/><text x="939" y="209" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Queue</text>
    <text x="996" y="209" text-anchor="middle" fill="#5a6c7e" font-size="11">My</text>
    <text x="1040" y="209" text-anchor="middle" fill="#5a6c7e" font-size="11">History</text>
    <rect x="906" y="228" width="198" height="62" rx="12" fill="#fde7df"/>
    <text x="920" y="252" font-weight="600" fill="#13283a">Nayeem H.</text>
    <text x="920" y="272" fill="#5a6c7e">Sent a photo</text>
    <rect x="1048" y="242" width="46" height="18" rx="9" fill="#ee6a4d"/><text x="1071" y="255" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">2 min</text>
    <rect x="906" y="300" width="198" height="62" rx="12" fill="#e2eff7"/>
    <text x="920" y="324" font-weight="600" fill="#13283a">Rahim K.</text>
    <text x="920" y="344" fill="#5a6c7e">Asked for a person</text>
    <rect x="1048" y="314" width="46" height="18" rx="9" fill="#13283a"/><text x="1071" y="327" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">4 min</text>
    <rect x="906" y="372" width="198" height="62" rx="12" fill="#ddf4ea"/>
    <text x="920" y="396" font-weight="600" fill="#13283a">AI chatbot</text>
    <text x="920" y="416" fill="#5a6c7e">Active · 86 chats today</text>
    <rect x="1066" y="388" width="28" height="16" rx="8" fill="#3fb37f"/><circle cx="1086" cy="396" r="6" fill="#fff"/>
    <!-- push notification -->
    <rect x="904" y="452" width="202" height="76" rx="14" fill="#13283a"/>
    <text x="918" y="476" fill="#9cc8e4" font-size="11" font-weight="700">NEW TRANSFER</text>
    <text x="918" y="496" fill="#fff" font-weight="600">Nayeem H. needs an agent</text>
    <text x="918" y="514" fill="#a9bccb" font-size="11.5">Tap to open the chat</text>
  </g>

  <text x="1130" y="600" text-anchor="end" font-size="13" fill="#5a6c7e">Illustration · private client project</text>
